name: Build and Test

on:
  push:
    branches:
      - main
      - release-v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: lint skipped"

  gen-check:
    name: Code Generation
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: code generation skipped"

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: tests skipped"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Create demo artifacts
        run: |
          mkdir -p demo-artifacts
          for name in occ manager openchoreo-api observer event-forwarder cluster-gateway cluster-agent remote-agent remote-agent-router; do
            printf '#!/usr/bin/env sh\necho xdp demo artifact: %s\n' "$name" > "demo-artifacts/${name}"
            chmod +x "demo-artifacts/${name}"
          done

      - name: Upload occ binaries
        uses: actions/upload-artifact@v4
        with:
          name: occ
          path: demo-artifacts/occ

      - name: Upload manager binaries
        uses: actions/upload-artifact@v4
        with:
          name: manager
          path: demo-artifacts/manager

      - name: Upload openchoreo-api binaries
        uses: actions/upload-artifact@v4
        with:
          name: openchoreo-api
          path: demo-artifacts/openchoreo-api

      - name: Upload observer binaries
        uses: actions/upload-artifact@v4
        with:
          name: observer
          path: demo-artifacts/observer

      - name: Upload event-forwarder binaries
        uses: actions/upload-artifact@v4
        with:
          name: event-forwarder
          path: demo-artifacts/event-forwarder

      - name: Upload cluster-gateway binaries
        uses: actions/upload-artifact@v4
        with:
          name: cluster-gateway
          path: demo-artifacts/cluster-gateway

      - name: Upload cluster-agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: cluster-agent
          path: demo-artifacts/cluster-agent

      - name: Upload remote-agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent
          path: demo-artifacts/remote-agent

      - name: Upload remote-agent-router binaries
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-router
          path: demo-artifacts/remote-agent-router

  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "xdp demo: agent tests skipped"

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [lint, gen-check, test, build, agent-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-candidates.yml
    secrets:
      OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
      OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
